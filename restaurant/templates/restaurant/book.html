{% extends 'restaurant/base.html' %}
{% load static %}
{% block title %}Book a table{% endblock %}
{% block content %}
<section class="split">
  <div>
    <h1>Book a table</h1>
    <form method="post" class="form" novalidate>
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <div class="field{% if field.errors %} field-error{% endif %}">
          {{ field.label_tag }}
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <button type="submit" class="button">Reserve</button>
    </form>
  </div>
  <img src="{% static 'img/pasta.jpg' %}" alt="Fresh pasta" loading="lazy">
</section>
{% endblock %}
